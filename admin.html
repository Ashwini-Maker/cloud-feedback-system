<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Admin Dashboard</h1>
    <button id="login">Sign in with Google</button>
    <p id="avg"></p>
    <ul id="list"></ul>
  </div>

  <script type="module">
    import { db, auth } from "./firebase.js";
    import { GoogleAuthProvider, signInWithPopup }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, orderBy, query }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    document.getElementById("login").onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        const snap = await getDocs(query(collection(db, "feedback"), orderBy("createdAt", "desc")));
        let total = 0, count = 0;
        const list = document.getElementById("list");
        list.innerHTML = "";
        snap.forEach(d => {
          const f = d.data();
          total += f.rating;
          count++;
          const li = document.createElement("li");
          li.textContent = f.name + " (" + f.rating + "/5): " + f.message;
          list.appendChild(li);
        });
        document.getElementById("avg").textContent = count
          ? "Average rating: " + (total / count).toFixed(1) + " from " + count + " responses"
          : "No feedback yet";
      } catch (e) {
        document.getElementById("avg").textContent = "Error: " + e.message;
      }
    };
  </script>
</body>
</html>
